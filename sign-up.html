<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="css/all.min.css">
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <link rel="stylesheet" href="css/main.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@200..1000&display=swap" rel="stylesheet">
</head>

<body>
    <a href="index.html" class="back-home-btn">
        <i class="fa-solid fa-arrow-right"></i>
        <span data-ar="العودة للرئيسية" data-en="Back to Home"> العودة للرئيسية</span>
    </a>
    <div class="d-flex justify-content-center align-items-center">
        <div class="login-container">
            <div class="heading" data-ar="تسجيل الدخول" data-en="Login"></div>
            <form action="" class="form">
                <input required class="input" type="text" name="firstName" id="firstName" placeholder="الاسم الاول"
                    data-ar="الاسم الاول" data-en="First Name">
                <input required class="input" type="text" name="lastName" id="lastName" placeholder="الاسم الاخير"
                    data-ar="الاسم الاخير" data-en="Last Name">
                <input required class="input" type="tel" name="phone" id="phone" placeholder="رقم الهاتف"
                    data-ar="رقم الهاتف" data-en="Phone Number">
                <input required class="input" type="number" name="IdNumber" id="IdNumber" placeholder="رقم الهوية"
                    data-ar="رقم الهوية" data-en="ID Number">
                <input required class="input" type="password" name="password" id="password" placeholder="الرقم السري"
                    data-ar="الرقم السري" data-en="Password">
                <input required class="input" type="password" name="confirmPassword" id="confirmPassword"
                    placeholder="تأكيد الرقم السري" data-ar="تأكيد الرقم السري" data-en="Confirm Password">

                <button class="login-button" data-ar="انشاء حساب جديد" data-en="Create New Account">انشاء حساب
                    جديد</button>

                <div class="d-flex justify-content-between align-items-center">
                    <span class="forgot-password" data-ar="لديك حساب بالفعل؟" data-en="Already have an account?">لديك
                        حساب بالفعل؟</span>
                    <span class="sign-in"><a href="login.html" data-ar="تسجيل الدخول" data-en="Sign In">تسجيل
                            الدخول</a></span>
                </div>
            </form>
        </div>
    </div>
    <script src="js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="js/main.js"></script>
</body>

</html>
